<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7ff" />
    <meta name="description" content="Discover meaningful job opportunities, explore companies hiring, and move your career forward with HireFlow." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HireFlow — Where Careers Find Their Flow" />
    <meta property="og:description" content="Discover meaningful opportunities, connect with great companies, and move your career forward." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HireFlow — Where Careers Find Their Flow</title>
    <script>
        (() => {
            try {
                const stored = localStorage.getItem('hireflow-theme');
                const theme = stored === 'light' || stored === 'dark'
                    ? stored
                    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
                document.documentElement.classList.toggle('dark', theme === 'dark');
            } catch {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
